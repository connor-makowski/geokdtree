[tool.black]
line-length = 80
target-version = ['py312']
exclude = '/.*(__pycache__).*/'

[build-system]
requires = ["scikit_build_core", "nanobind>=3.1.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
build.verbose = false
build-dir = "build/{wheel_tag}"

[[tool.scikit-build.overrides]]
if.env.GEOKDTREE_NO_BUILD = true
wheel.cmake = false

[[tool.scikit-build.overrides]]
if.failed = true
if.not.env.GEOKDTREE_REQUIRE_CPP = true
wheel.cmake = false

[tool.scikit-build.sdist]
exclude = ["*"]
include = [
    "geokdtree/*.py",
    "geokdtree/cpp/*",
    "pyproject.toml",
    "CMakeLists.txt",
    "README.md",
    "LICENSE",
]

[project]
name = "geokdtree"
version = "1.3.0b1"
description = "Find closest points in log time."
authors = [
    {name="Connor Makowski", email="conmak@mit.edu"}
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    'License :: OSI Approved :: MIT License',
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "autoflake>=2.3.1",
    "black>=25.1.0",
    "build>=1.2.2",
    "nox>=2026.4.10",
    "nox-uv>=0.8.0",
    "pdoc>=15.0.1",
    "twine>=6.1.0",
    "scikit-build-core>=1.0.3",
    "nanobind>=3.1.0",
]

[project.urls]
"Homepage" = "https://github.com/connor-makowski/geokdtree"
"Bug Tracker" = "https://github.com/connor-makowski/geokdtree/issues"
"Documentation" = "https://connor-makowski.github.io/geokdtree/geokdtree.html"

[tool.uv]
no-build-isolation-package = []

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]


[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*-win32 *_i686 pp*"
test-command = "pytest {project}/test"
test-requires = ["pytest>=9.0.3"]


[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.windows]
repair-wheel-command = ""


